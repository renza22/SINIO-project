<!doctype html>
<html lang="id" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelola Layanan | SINIO Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root{
      --brand-primary:#689F99;
      --brand-secondary:#1F4F4A;
      --brand-soft:#eef7f5;
    }
    body{
      background: linear-gradient(180deg,#f7fbfa 0%,#ffffff 60%,#f7fbfa 100%);
      font-family: 'Poppins', sans-serif;
      color: var(--brand-secondary);
      min-height:100vh;
    }
    .navbar-sinio{ background: rgba(255,255,255,.92); border-bottom:1px solid rgba(104,159,153,.18); }
    .card-glass{ background: rgba(255,255,255,.9); border:1px solid rgba(104,159,153,.15); box-shadow:0 16px 40px rgba(79,127,122,.12); border-radius:1.25rem; }
    .section-title{ letter-spacing:.12em; text-transform:uppercase; font-size:.82rem; color:rgba(31,79,74,.6); }
    .badge-pill{ border-radius:999px; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light navbar-sinio sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-semibold" href="/dashboard/admin">
      <i class="bi bi-arrow-left-circle me-2"></i> Dashboard Admin
    </a>
    <div class="ms-auto small text-muted d-none d-md-block">
      <div th:text="${userName}">Administrator</div>
      <div th:text="${userEmail}">admin@sinio.com</div>
    </div>
  </div>
</nav>

<main class="container py-4 py-lg-5">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
    <div>
      <p class="section-title mb-1">Operasional</p>
      <h1 class="h4 fw-semibold mb-0">Kelola Layanan Kamar</h1>
      <div class="text-muted small">Tambah, ubah harga, atau hapus layanan per kamar.</div>
    </div>
    <a class="btn btn-outline-secondary" href="/dashboard/admin"><i class="bi bi-house"></i> Dashboard</a>
  </div>

  <div th:if="${adminError != null}" class="alert alert-danger" th:text="${adminError}">Terjadi kesalahan.</div>
  <div th:if="${adminSuccess != null}" class="alert alert-success" th:text="${adminSuccess}">Berhasil.</div>

  <div class="accordion" id="accordionLayanan">
    <div class="accordion-item card-glass" th:each="room,iter : ${roomsWithServices}">
      <h2 class="accordion-header" th:attr="id=${'heading' + room.id}">
        <button class="accordion-button fw-semibold" type="button" data-bs-toggle="collapse"
                th:attr="data-bs-target=${'#collapse' + room.id}" aria-expanded="true"
                th:aria-controls="${'collapse' + room.id}">
          <span class="me-2 badge bg-light text-dark border" th:text="${room.nomor}">101</span>
          <span th:text="${room.tipe}">Deluxe</span>
        </button>
      </h2>
      <div th:attr="id=${'collapse' + room.id}" class="accordion-collapse collapse" th:classappend="${iter.index == 0}? ' show'" th:aria-labelledby="${'heading' + room.id}" data-bs-parent="#accordionLayanan">
        <div class="accordion-body">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
              <tr>
                <th>Nama</th>
                <th>Satuan</th>
                <th>Harga</th>
                <th class="text-end">Aksi</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="svc : ${room.layanan}">
                <form th:attr="id=${'update-' + svc.id}" th:action="@{'/admin/layanan/' + ${svc.id} + '/update'}" method="post"></form>
                <td><input type="text" class="form-control" name="nama" th:attr="form=${'update-' + svc.id}" th:value="${svc.name}" required></td>
                <td><input type="text" class="form-control" name="satuan" th:attr="form=${'update-' + svc.id}" th:value="${svc.unit}"></td>
                <td><input type="number" min="0" step="0.01" class="form-control" name="harga" th:attr="form=${'update-' + svc.id}" th:value="${svc.price}"></td>
                <td class="text-end d-flex gap-2 justify-content-end">
                  <button class="btn btn-sm btn-outline-primary" type="submit" th:attr="form=${'update-' + svc.id}">
                    <i class="bi bi-save"></i> Simpan
                  </button>
                  <form th:action="@{'/admin/layanan/' + ${svc.id} + '/delete'}" method="post" onsubmit="return confirm('Hapus layanan ini?');">
                    <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(room.layanan)}">
                <td colspan="4" class="text-center text-muted">Belum ada layanan untuk kamar ini.</td>
              </tr>
              </tbody>
            </table>
          </div>

          <hr>
          <h6 class="fw-semibold mb-2">Tambah layanan</h6>
          <form class="row g-2 align-items-end" th:action="@{/admin/layanan}" method="post">
            <input type="hidden" name="roomId" th:value="${room.id}">
            <div class="col-12 col-md-5">
              <label class="form-label small">Nama layanan</label>
              <input type="text" name="nama" class="form-control" placeholder="Contoh: Laundry" required>
            </div>
            <div class="col-6 col-md-2">
              <label class="form-label small">Satuan</label>
              <input type="text" name="satuan" class="form-control" placeholder="kg">
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label small">Harga</label>
              <input type="number" min="0" step="0.01" name="harga" class="form-control" placeholder="25000">
            </div>
            <div class="col-12 col-md-2 d-grid">
              <button class="btn btn-primary" type="submit"><i class="bi bi-plus-circle"></i> Tambah</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
