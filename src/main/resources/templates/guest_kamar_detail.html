<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detail Kamar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    html, body{ max-width:100%; overflow-x:hidden; }
    body{ overscroll-behavior-y: contain; }
    main, .container, .container-fluid{ overflow-x:hidden; }
    img, svg, video{ max-width:100%; height:auto; }
    :root{ --tosca-50:#ecfdfb; --tosca-500:#18b7a6; --tosca-600:#119a8d; --tosca-700:#0e7b71; --glass-bg: rgba(255,255,255,.18); --glass-stroke: rgba(255,255,255,.4); --glass-shadow: 0 6px 28px rgba(0,0,0,.18); }
    body{ background: radial-gradient(1200px 800px at 10% -10%, rgba(24,183,166,.22), transparent 55%), radial-gradient(900px 600px at 120% 30%, rgba(63,210,189,.20), transparent 55%), linear-gradient(180deg, #f7fffe 0%, #f9fffd 60%, #f7fffe 100%); min-height:100dvh; color:#0b4e49; }
    .glass{ backdrop-filter: blur(14px) saturate(120%); -webkit-backdrop-filter: blur(14px) saturate(120%); background: var(--glass-bg); border: 1px solid var(--glass-stroke); box-shadow: var(--glass-shadow); border-radius: 1rem; }
    .navbar-glass{ backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: rgba(255,255,255,.55) !important; border-bottom: 1px solid var(--glass-stroke); }
    .navbar-brand{ color: var(--tosca-700); font-weight:700; }
    .btn-tosca{ --bs-btn-bg: var(--tosca-500); --bs-btn-border-color: var(--tosca-500); --bs-btn-hover-bg: var(--tosca-600); --bs-btn-hover-border-color: var(--tosca-600); --bs-btn-active-bg: var(--tosca-700); --bs-btn-active-border-color: var(--tosca-700); --bs-btn-color:#fff; }
    .btn-outline-tosca{ --bs-btn-color: var(--tosca-700); --bs-btn-border-color: var(--tosca-500); --bs-btn-hover-bg: var(--tosca-500); --bs-btn-hover-border-color: var(--tosca-500); --bs-btn-active-bg: var(--tosca-600); --bs-btn-active-border-color: var(--tosca-600); }
    .table.table-striped>tbody>tr:nth-of-type(odd){ --bs-table-accent-bg: rgba(24,183,166,.05); }
    .table.table-hover tbody tr:hover{ background: rgba(24,183,166,.09); }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-glass sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="/guest">My Stay</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/guest">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/guest/kamar">Pilih Kamar</a></li>
        <li class="nav-item"><a class="nav-link" href="/logout" onclick="return confirm('Yakin ingin keluar dari akun?');">Keluar</a></li>
      </ul>
    </div>
  </div>
  </nav>

<main class="container p-3 p-md-4" th:object="${room}">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 m-0 text-tosca" th:text="${'Kamar ' + room.number}">Kamar 101</h1>
    <a class="btn btn-outline-tosca btn-sm" href="/guest/kamar">Kembali</a>
  </div>

  <div class="row g-4">
    <div class="col-12 col-lg-5">
      <div class="glass rounded-3 ratio ratio-4x3 d-flex align-items-center justify-content-center">
        <span class="text-muted">Foto kamar</span>
      </div>
      <div class="mt-3">
        <div class="h6">Informasi</div>
        <div class="small text-muted">Tipe</div>
        <div th:text="${room.type.displayName}">Deluxe King</div>
        <div class="small text-muted mt-2">Tarif per malam</div>
        <div class="fw-semibold" th:text="${#numbers.formatDecimal(room.rate,0,'POINT',2,'COMMA')}">800.000</div>
        <div class="small text-muted mt-2">Status</div>
        <span class="badge" th:classappend="${room.status.name()=='AVAILABLE' ? ' text-bg-success' : (room.status.name()=='BOOKED' ? ' text-bg-warning' : ' text-bg-secondary') }" th:text="${room.status.displayName}">Tersedia</span>
      </div>
      <div class="card glass mt-3">
        <div class="card-body">
          <form th:action="@{/guest/reservasi}" method="post" class="row g-2">
            <input type="hidden" name="roomId" th:value="${room.id}">
            <div class="col-6">
              <label class="form-label">Check-in</label>
              <input type="date" class="form-control" name="checkIn" required th:attr="min=${#temporals.format(#temporals.createNow(),'yyyy-MM-dd')}">
            </div>
            <div class="col-6">
              <label class="form-label">Check-out</label>
              <input type="date" class="form-control" name="checkOut" required th:attr="min=${#temporals.format(#temporals.createNow().plusDays(1),'yyyy-MM-dd')}">
            </div>
            <div class="col-12 d-grid mt-2">
              <button class="btn btn-tosca" type="submit"><i class="bi bi-calendar2-check"></i> Pesan Kamar Ini</button>
            </div>
          </form>
          <div class="text-danger small mt-2" th:if="${guestError != null}" th:text="${guestError}"></div>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-7">
      <div class="card glass mb-3">
        <div class="card-header"><strong>Fasilitas Kamar</strong></div>
        <div class="card-body">
          <ul class="mb-0">
            <li th:each="f : ${amenities}" th:text="${f}">Wi‑Fi</li>
          </ul>
        </div>
      </div>

      <div class="card glass">
        <div class="card-header"><strong>Layanan Tersedia</strong> <span class="text-muted small">(berdasarkan permintaan)</span></div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-sm table-striped align-middle table-kaca">
              <thead><tr><th>Nama Layanan</th><th>Tarif</th></tr></thead>
              <tbody>
                <tr th:each="s : ${services}">
                  <td th:text="${s.nama + ' / ' + s.satuan}">Laundry / kg</td>
                  <td th:text="${#numbers.formatDecimal(s.hargaSatuan,0,'POINT',2,'COMMA')}">25.000</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
