<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservasi Saya</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{ --tosca-50:#ecfdfb; --tosca-500:#18b7a6; --tosca-600:#119a8d; --tosca-700:#0e7b71; --glass-bg: rgba(255,255,255,.18); --glass-stroke: rgba(255,255,255,.4); --glass-shadow: 0 6px 28px rgba(0,0,0,.18); }
    body{ background: radial-gradient(1200px 800px at 10% -10%, rgba(24,183,166,.22), transparent 55%), radial-gradient(900px 600px at 120% 30%, rgba(63,210,189,.20), transparent 55%), linear-gradient(180deg, #f7fffe 0%, #f9fffd 60%, #f7fffe 100%); min-height:100dvh; color:#0b4e49; }
    .glass{ backdrop-filter: blur(14px) saturate(120%); -webkit-backdrop-filter: blur(14px) saturate(120%); background: var(--glass-bg); border: 1px solid var(--glass-stroke); box-shadow: var(--glass-shadow); border-radius: 1rem; }
    .navbar-glass{ backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: rgba(255,255,255,.55) !important; border-bottom: 1px solid var(--glass-stroke); }
    .navbar-brand{ color: var(--tosca-700); font-weight:700; }
    .btn-tosca{ --bs-btn-bg: var(--tosca-500); --bs-btn-border-color: var(--tosca-500); --bs-btn-hover-bg: var(--tosca-600); --bs-btn-hover-border-color: var(--tosca-600); --bs-btn-active-bg: var(--tosca-700); --bs-btn-active-border-color: var(--tosca-700); --bs-btn-color:#fff; }
    .btn-outline-tosca{ --bs-btn-color: var(--tosca-700); --bs-btn-border-color: var(--tosca-500); --bs-btn-hover-bg: var(--tosca-500); --bs-btn-hover-border-color: var(--tosca-500); --bs-btn-active-bg: var(--tosca-600); --bs-btn-active-border-color: var(--tosca-600); }
    .table.table-striped>tbody>tr:nth-of-type(odd){ --bs-table-accent-bg: rgba(24,183,166,.05); }
    .table.table-hover tbody tr:hover{ background: rgba(24,183,166,.09); }
    .table-kaca thead{ position: sticky; top: 0; z-index: 1; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: rgba(255,255,255,.75); border-bottom: 1px solid var(--glass-stroke); }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-glass sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="/guest">My Stay</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/guest">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Reservasi Saya</a></li>
        <li class="nav-item"><a class="nav-link" href="/logout">Keluar</a></li>
      </ul>
    </div>
  </div>
  </nav>

<main class="container p-3 p-md-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 m-0 text-tosca">Reservasi Saya</h1>
    <a class="btn btn-outline-tosca btn-sm" href="/guest">Kembali</a>
  </div>

  <div th:if="${guestMessage != null}" class="alert alert-success glass" th:text="${guestMessage}"></div>
  <div th:if="${guestError != null}" class="alert alert-danger glass" th:text="${guestError}"></div>

  <div class="alert glass" th:if="${#lists.isEmpty(reservations)}">
    Belum ada reservasi. Silakan <a href="/guest/kamar" class="alert-link">pilih kamar</a> untuk melakukan pemesanan.
  </div>

  <div th:if="${!#lists.isEmpty(reservations)}" class="table-responsive glass p-2">
    <table class="table table-striped align-middle table-kaca mb-0">
      <thead><tr><th>Kode</th><th>Kamar</th><th>Periode</th><th>Status</th><th></th></tr></thead>
      <tbody>
        <tr th:each="r : ${reservations}">
          <td th:text="${r.kode}">RSV-001</td>
          <td th:text="${r.nomorKamar + ' (' + r.tipe + ')'}">301 (Suite)</td>
          <td th:text="${r.periode}">23-27 Sep 2025</td>
          <td th:text="${r.status}">CHECK_IN</td>
          <td class="text-end"><a class="btn btn-sm btn-tosca" th:href="@{/guest/reservasi/{id}(id=${r.id})}">Detail</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
